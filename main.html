<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NOVA Schedule</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      --bg: #05060F;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --muted-2: #64748B;
      --cyan: #00E5FF;
      --purple: #A855F7;
      --safe-area-inset-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', 'Manrope', sans-serif;
    }

    .glass {
      background: rgba(15, 23, 42, 0.62);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .field {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(5, 6, 15, 0.65);
      color: var(--text);
      padding: 10px 14px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.15);
    }

    .field option {
      background: #0F172A;
      color: #F8FAFC;
    }

    .chip {
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip:hover {
      border-color: rgba(255, 255, 255, 0.28);
      color: var(--text);
    }

    .chip.active {
      background: var(--cyan);
      border-color: var(--cyan);
      color: #04060F;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      border-color: rgba(255, 255, 255, 0.28);
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .rise {
      animation: riseIn 0.28s ease-out both;
    }

    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      opacity: 0.7;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useState, useEffect, useMemo, useRef } from "https://esm.sh/react@18.3.1";
    import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
    import {
      Clock,
      Calendar,
      ChevronLeft,
      ChevronRight,
      Check,
      CheckCircle2,
      Zap,
      Flame,
      ListFilter,
      Pencil,
      Plus,
      RotateCcw,
      Search,
      Sparkles,
      Trash2,
      Upload,
      Download,
      X,
      LogOut,
      Cloud,
      User
    } from "https://esm.sh/lucide-react@0.469.0";

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      deleteDoc,
      onSnapshot,
      getDocs,
      writeBatch
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

    // =========================================================================
    // 1. KONFIGURASI FIREBASE (Ganti dengan milikmu — sama dengan index.html)
    // =========================================================================
    const firebaseConfig = {
  apiKey: "AIzaSyDGSSNs6k8VbdCgkTBlO82t3dB13EKL0ns",
  authDomain: "calender-fzoooi.firebaseapp.com",
  projectId: "calender-fzoooi",
  storageBucket: "calender-fzoooi.firebasestorage.app",
  messagingSenderId: "776889435651",
  appId: "1:776889435651:web:3a1c36f67df3c33b8bf036"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // =========================================================================
    // 2. KONSTANTA & HELPER
    // =========================================================================
    const LOCAL_STORAGE_KEY = "nova_schedule_v1";
    const CATEGORIES = ["Kerja", "Kuliah", "Pribadi", "Olahraga", "Meeting", "Lainnya"];
    const CATEGORY_COLORS = {
      Kerja: "#00E5FF",
      Kuliah: "#A855F7",
      Pribadi: "#F472B6",
      Olahraga: "#34D399",
      Meeting: "#FBBF24",
      Lainnya: "#94A3B8"
    };
    const ACCENT_COLORS = ["#00E5FF", "#A855F7", "#F472B6", "#FBBF24", "#34D399", "#60A5FA"];
    const STATUS_FILTERS = ["Semua", "Hari Ini", "Mendatang", "Selesai"];

    function toDateISO(dateObj) {
      return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, "0")}-${String(
        dateObj.getDate()
      ).padStart(2, "0")}`;
    }

    function formatLongDate(dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      return new Intl.DateTimeFormat("id-ID", {
        day: "numeric",
        month: "long",
        year: "numeric"
      }).format(new Date(y, m - 1, d));
    }

    function formatShortDay(dateStr) {
      const [y, m, d] = dateStr.split("-").map(Number);
      return new Intl.DateTimeFormat("id-ID", { weekday: "short" }).format(new Date(y, m - 1, d));
    }

    function schedulesColRef(uid) {
      return collection(db, "users", uid, "schedules");
    }

    async function migrateLocalDataIfEmpty(uid) {
      const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (!raw) return false;

      let parsedList = [];
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) parsedList = parsed;
      } catch {
        return false;
      }
      if (!parsedList.length) return false;

      const existingSnap = await getDocs(schedulesColRef(uid));
      if (!existingSnap.empty) return false;

      const batch = writeBatch(db);
      for (const item of parsedList) {
        if (!item || typeof item.title !== "string" || typeof item.date !== "string") continue;
        const id = String(item.id || `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`);
        batch.set(doc(db, "users", uid, "schedules", id), {
          id,
          title: String(item.title),
          date: String(item.date),
          start: String(item.start || "09:00"),
          end: String(item.end || "10:00"),
          category: CATEGORIES.includes(item.category) ? item.category : "Lainnya",
          priority: ["Tinggi", "Sedang", "Rendah"].includes(item.priority) ? item.priority : "Sedang",
          note: String(item.note || ""),
          color: String(item.color || "#00E5FF"),
          done: Boolean(item.done),
          updatedAt: Date.now()
        });
      }
      await batch.commit();
      return true;
    }

    const h = React.createElement;

    // =========================================================================
    // 3. KOMPONEN UTAMA NOVA SCHEDULE
    // =========================================================================
    function NovaScheduleApp() {
      const [user, setUser] = useState(null);
      const [authChecking, setAuthChecking] = useState(true);
      const [syncing, setSyncing] = useState(true);

      const [schedules, setSchedules] = useState([]);
      const [now, setNow] = useState(new Date());

      // Form state
      const [title, setTitle] = useState("");
      const [date, setDate] = useState(toDateISO(new Date()));
      const [start, setStart] = useState("09:00");
      const [end, setEnd] = useState("10:00");
      const [category, setCategory] = useState(null);
      const [priority, setPriority] = useState(null);
      const [note, setNote] = useState("");
      const [color, setColor] = useState("#00E5FF");
      const [editingId, setEditingId] = useState(null);
      const [formError, setFormError] = useState("");

      // Filter & UI state
      const [search, setSearch] = useState("");
      const [statusFilter, setStatusFilter] = useState("Semua");
      const [categoryFilter, setCategoryFilter] = useState("Semua");
      const [selectedDate, setSelectedDate] = useState(null);
      const [monthOffset, setMonthOffset] = useState(0);
      const [toast, setToast] = useState("");
      const [confirmClearAll, setConfirmClearAll] = useState(false);
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);

      const fileInputRef = useRef(null);

      // Live clock
      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Toast auto-dismiss
      useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(""), 3000);
        return () => clearTimeout(timer);
      }, [toast]);

      // Firebase Auth & Real-time Firestore Listener
      useEffect(() => {
        let unsubscribeFirestore = null;

        const unsubscribeAuth = onAuthStateChanged(auth, async (firebaseUser) => {
          if (!firebaseUser) {
            window.location.replace("./index.html");
            return;
          }

          setUser(firebaseUser);
          setAuthChecking(false);
          setSyncing(true);

          try {
            const migrated = await migrateLocalDataIfEmpty(firebaseUser.uid);
            if (migrated) {
              setToast("Data jadwal lokal berhasil dimigrasi ke akunmu");
            }
          } catch (err) {
            console.error("Gagal migrasi data lokal:", err);
          }

          if (unsubscribeFirestore) unsubscribeFirestore();
          unsubscribeFirestore = onSnapshot(
            schedulesColRef(firebaseUser.uid),
            (snapshot) => {
              const items = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
              setSchedules(items);
              setSyncing(false);
            },
            (err) => {
              console.error("Firestore snapshot error:", err);
              setSyncing(false);
              setToast("Gagal menyinkronkan data dari cloud.");
            }
          );
        });

        return () => {
          unsubscribeAuth();
          if (unsubscribeFirestore) unsubscribeFirestore();
        };
      }, []);

      // Computed metrics
      const todayISO = toDateISO(now);
      const todaySchedules = schedules.filter((item) => item.date === todayISO);
      const todayDoneCount = todaySchedules.filter((item) => item.done).length;
      const upcomingCount = schedules.filter((item) => item.date > todayISO && !item.done).length;

      const activeStripDate = selectedDate || todayISO;
      const stripSchedules = schedules.filter((item) => item.date === activeStripDate);
      const stripDoneCount = stripSchedules.filter((item) => item.done).length;
      const stripProgress = stripSchedules.length
        ? Math.round((stripDoneCount / stripSchedules.length) * 100)
        : 0;

      const filteredSchedules = useMemo(() => {
        return schedules
          .filter((item) => {
            if (
              search &&
              !item.title.toLowerCase().includes(search.toLowerCase()) &&
              !(item.note || "").toLowerCase().includes(search.toLowerCase())
            ) {
              return false;
            }
            if (categoryFilter !== "Semua" && item.category !== categoryFilter) return false;
            if (selectedDate && item.date !== selectedDate) return false;
            if (statusFilter === "Hari Ini" && item.date !== todayISO) return false;
            if (statusFilter === "Mendatang" && !(item.date > todayISO)) return false;
            if (statusFilter === "Selesai" && !item.done) return false;
            return true;
          })
          .sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
      }, [schedules, search, categoryFilter, selectedDate, statusFilter, todayISO]);

      const next7Days = useMemo(
        () =>
          Array.from({ length: 7 }, (_, idx) => {
            const d = new Date(now);
            d.setDate(d.getDate() + idx);
            return toDateISO(d);
          }),
        [now]
      );

      const viewedMonth = useMemo(
        () => new Date(now.getFullYear(), now.getMonth() + monthOffset, 1),
        [now, monthOffset]
      );

      const calendarCells = useMemo(() => {
        const firstDayOffset = (new Date(viewedMonth.getFullYear(), viewedMonth.getMonth(), 1).getDay() + 6) % 7;
        const daysInMonth = new Date(viewedMonth.getFullYear(), viewedMonth.getMonth() + 1, 0).getDate();
        return [
          ...Array(firstDayOffset).fill(""),
          ...Array.from({ length: daysInMonth }, (_, idx) =>
            toDateISO(new Date(viewedMonth.getFullYear(), viewedMonth.getMonth(), idx + 1))
          )
        ];
      }, [viewedMonth]);

      const countByDate = useMemo(() => {
        const map = new Map();
        schedules.forEach((item) => map.set(item.date, (map.get(item.date) || 0) + 1));
        return map;
      }, [schedules]);

      const categoryStats = CATEGORIES.map((cat) => ({
        name: cat,
        count: schedules.filter((item) => item.category === cat).length,
        color: CATEGORY_COLORS[cat]
      }));

      const totalDoneCount = schedules.filter((item) => item.done).length;
      const totalDonePercent = schedules.length
        ? Math.round((totalDoneCount / schedules.length) * 100)
        : 0;

      const donutSegments = useMemo(() => {
        let acc = 0;
        return categoryStats
          .filter((item) => item.count > 0)
          .map((item) => {
            const pct = (item.count / schedules.length) * 100;
            const seg = { ...item, from: acc, to: acc + pct };
            acc += pct;
            return seg;
          });
      }, [schedules]);

      // Handlers (Firestore CRUD)
      function resetForm() {
        setTitle("");
        setDate(toDateISO(new Date()));
        setStart("09:00");
        setEnd("10:00");
        setCategory(null);
        setPriority(null);
        setNote("");
        setColor("#00E5FF");
        setEditingId(null);
        setFormError("");
      }

      async function handleSubmit(e) {
        e.preventDefault();
        if (!user) return;
        if (!title.trim()) {
          setFormError("Judul jadwal wajib diisi.");
          return;
        }
        if (!category) {
          setFormError("Pilih kategori jadwal terlebih dahulu.");
          return;
        }
        if (!priority) {
          setFormError("Pilih prioritas jadwal terlebih dahulu.");
          return;
        }
        if (end <= start) {
          setFormError("Jam selesai harus setelah jam mulai.");
          return;
        }

        const id = editingId || `${Math.random().toString(36).slice(2)}${Date.now()}`;
        const existingItem = editingId ? schedules.find((s) => s.id === editingId) : null;

        const payload = {
          id,
          title: title.trim(),
          date,
          start,
          end,
          category,
          priority,
          note: note.trim(),
          color,
          done: existingItem ? Boolean(existingItem.done) : false,
          updatedAt: Date.now()
        };

        try {
          await setDoc(doc(db, "users", user.uid, "schedules", id), payload, { merge: true });
          setToast(editingId ? "Jadwal diperbarui di cloud" : "Jadwal disimpan ke cloud");
          resetForm();
        } catch (err) {
          console.error(err);
          setFormError("Gagal menyimpan ke cloud. Periksa koneksi internet.");
        }
      }

      function startEdit(item) {
        setEditingId(item.id);
        setTitle(item.title);
        setDate(item.date);
        setStart(item.start);
        setEnd(item.end);
        setCategory(item.category);
        setPriority(item.priority);
        setNote(item.note || "");
        setColor(item.color || "#00E5FF");
        setFormError("");
        document.getElementById("form-jadwal")?.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      async function toggleDone(item) {
        if (!user) return;
        try {
          await setDoc(
            doc(db, "users", user.uid, "schedules", item.id),
            { done: !item.done, updatedAt: Date.now() },
            { merge: true }
          );
        } catch (err) {
          console.error(err);
          setToast("Gagal memperbarui status jadwal.");
        }
      }

      async function deleteOne(id) {
        if (!user) return;
        try {
          await deleteDoc(doc(db, "users", user.uid, "schedules", id));
          setConfirmDeleteId(null);
          if (editingId === id) resetForm();
          setToast("Jadwal dihapus");
        } catch (err) {
          console.error(err);
          setToast("Gagal menghapus jadwal.");
        }
      }

      async function clearAllSchedules() {
        if (!user) return;
        try {
          const snap = await getDocs(schedulesColRef(user.uid));
          const batch = writeBatch(db);
          snap.forEach((d) => batch.delete(d.ref));
          await batch.commit();
          setConfirmClearAll(false);
          resetForm();
          setToast("Semua jadwal dihapus dari cloud");
        } catch (err) {
          console.error(err);
          setToast("Gagal menghapus semua jadwal.");
        }
      }

      function exportJSON() {
        const blob = new Blob([JSON.stringify(schedules, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "nova-schedule.json";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 500);
        setToast("File jadwal diunduh");
      }

      function importJSON(file) {
        if (!user) return;
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const parsed = JSON.parse(String(reader.result));
            if (!Array.isArray(parsed)) throw new Error("format");
            const validItems = parsed
              .filter((q) => q && typeof q.title === "string" && typeof q.date === "string")
              .map((q, idx) => ({
                id: String(q.id || `imp-${idx}-${Date.now()}`),
                title: String(q.title),
                date: String(q.date),
                start: String(q.start || "09:00"),
                end: String(q.end || "10:00"),
                category: CATEGORIES.includes(q.category) ? q.category : "Lainnya",
                priority: ["Tinggi", "Sedang", "Rendah"].includes(q.priority) ? q.priority : "Sedang",
                note: String(q.note || ""),
                color: String(q.color || "#00E5FF"),
                done: Boolean(q.done),
                updatedAt: Date.now()
              }));

            const batch = writeBatch(db);
            for (const item of validItems) {
              batch.set(doc(db, "users", user.uid, "schedules", item.id), item, { merge: true });
            }
            await batch.commit();
            setToast(`Impor berhasil · ${validItems.length} jadwal disinkronkan`);
          } catch {
            setToast("File tidak valid. Gunakan JSON dari Ekspor.");
          }
        };
        reader.readAsText(file);
      }

      async function handleLogout() {
        try {
          await signOut(auth);
          window.location.replace("./index.html");
        } catch (err) {
          console.error(err);
          setToast("Gagal keluar dari akun.");
        }
      }

      const isOverdue = (item) =>
        !item.done &&
        (item.date < todayISO ||
          (item.date === todayISO &&
            item.end <
              `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`));

      const formattedTodayHeader = new Intl.DateTimeFormat("id-ID", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
      }).format(now);

      const formattedTime = new Intl.DateTimeFormat("id-ID", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).format(now);

      if (authChecking) {
        return h(
          "div",
          {
            className: "min-h-screen grid place-items-center text-slate-300",
            style: { background: "#05060F" }
          },
          h("div", { className: "text-center space-y-3" }, [
            h("div", {
              key: "spin",
              className:
                "w-10 h-10 mx-auto rounded-full border-2 border-cyan-400 border-t-transparent animate-spin"
            }),
            h("p", { key: "txt", className: "text-sm text-slate-400" }, "Memverifikasi sesi akun...")
          ])
        );
      }

      return h(
        "div",
        {
          className: "min-h-screen relative overflow-x-clip text-[var(--text)]",
          style: {
            paddingTop: "var(--safe-area-inset-top)",
            background:
              "radial-gradient(900px 520px at 12% -10%, rgba(168,85,247,.28), transparent 60%), radial-gradient(820px 520px at 88% 4%, rgba(0,229,255,.20), transparent 58%), radial-gradient(700px 500px at 50% 115%, rgba(244,114,182,.12), transparent 60%), #05060F"
          }
        },
        [
          h("div", { key: "container", className: "mx-auto max-w-[1360px] px-4 sm:px-6 lg:px-8 pb-10" }, [
            // TOP ACCOUNT BAR
            h(
              "div",
              {
                key: "account-bar",
                className:
                  "pt-4 flex flex-wrap items-center justify-between gap-3 border-b border-white/10 pb-3"
              },
              [
                h("div", { key: "cloud-status", className: "flex items-center gap-2 text-xs text-[var(--muted)]" }, [
                  h(Cloud, {
                    size: 15,
                    className: syncing ? "text-amber-400 animate-pulse" : "text-emerald-400"
                  }),
                  h(
                    "span",
                    null,
                    syncing ? "Menyinkronkan cloud..." : "Tersinkronisasi dengan Firebase Cloud"
                  )
                ]),
                h("div", { key: "user-actions", className: "flex items-center gap-2.5" }, [
                  h(
                    "div",
                    {
                      className:
                        "flex items-center gap-2 rounded-full bg-white/5 border border-white/10 px-3 py-1.5 text-xs"
                    },
                    [
                      user?.photoURL
                        ? h("img", {
                            src: user.photoURL,
                            alt: "Avatar",
                            className: "w-5 h-5 rounded-full object-cover"
                          })
                        : h(User, { size: 14, className: "text-[var(--cyan)]" }),
                      h(
                        "span",
                        { className: "font-semibold max-w-[180px] truncate" },
                        user?.displayName || user?.email || "Pengguna"
                      )
                    ]
                  ),
                  h(
                    "button",
                    {
                      type: "button",
                      onClick: handleLogout,
                      className:
                        "inline-flex items-center gap-1.5 rounded-full border border-rose-500/30 bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 px-3 py-1.5 text-xs font-bold transition cursor-pointer"
                    },
                    [h(LogOut, { size: 13 }), "Keluar"]
                  )
                ])
              ]
            ),

            // HEADER
            h(
              "header",

                        h(
                          "p",
                          { className: "text-sm text-[var(--muted)] mt-1 [overflow-wrap:anywhere]" },
                          "Coba ubah pencarian, filter, atau tambahkan jadwal baru untuk hari yang lebih terarah."
                        ),
                        h(
                          "button",
                          {
                            type: "button",
                            onClick: () => {
                              setSearch("");
                              setCategoryFilter("Semua");
                              setStatusFilter("Semua");
                              setSelectedDate(null);
                            },
                            className: "mt-4 chip active"
                          },
                          "Atur Ulang Filter"
                        )
                      ])
                    : h(
                        "div",
                        { className: "space-y-3" },
                        filteredSchedules.map((item) => {
                          const overdue = isOverdue(item);
                          return h(
                            "article",
                            {
                              key: item.id,
                              className: "glass p-4 sm:p-5 flex gap-3 sm:gap-4 rise",
                              style: { borderLeft: `3px solid ${item.color || "#00E5FF"}` }
                            },
                            [
                              h(
                                "button",
                                {
                                  type: "button",
                                  onClick: () => toggleDone(item),
                                  "aria-label": item.done ? "Tandai belum selesai" : "Tandai selesai",
                                  className: `mt-1 shrink-0 w-6 h-6 rounded-full grid place-items-center border-2 transition cursor-pointer ${
                                    item.done
                                      ? "bg-[#34D399] border-[#34D399] text-black"
                                      : "border-white/30 hover:border-[#00E5FF]"
                                  }`
                                },
                                item.done && h(Check, { size: 15, strokeWidth: 3 })
                              ),
                              h("div", { className: "flex-1 min-w-0" }, [
                                h("div", { className: "flex flex-wrap items-center gap-2" }, [
                                  h(
                                    "h3",
                                    {
                                      className: `font-bold text-[16px] sm:text-lg leading-snug [overflow-wrap:anywhere] ${
                                        item.done ? "line-through text-[var(--muted)]" : ""
                                      }`
                                    },
                                    item.title
                                  ),
                                  overdue &&
                                    h(
                                      "span",
                                      {
                                        className:
                                          "inline-flex items-center gap-1 text-[11px] font-bold px-2 py-1 rounded-full bg-[#FB7185]/15 text-[#FB7185] border border-[#FB7185]/30"
                                      },
                                      [h(Flame, { size: 12 }), " Terlewat"]
                                    ),
                                  item.done &&
                                    h(
                                      "span",
                                      {
                                        className:
                                          "inline-flex items-center gap-1 text-[11px] font-bold px-2 py-1 rounded-full bg-[#34D399]/15 text-[#34D399] border border-[#34D399]/30"
                                      },
                                      [h(CheckCircle2, { size: 12 }), " Selesai"]
                                    )
                                ]),
                                item.note &&
                                  h(
                                    "p",
                                    { className: "text-sm text-[var(--muted)] mt-1 leading-relaxed [overflow-wrap:anywhere]" },
                                    item.note
                                  ),
                                h("div", { className: "flex flex-wrap items-center gap-2 mt-3" }, [
                                  h(
                                    "span",
                                    {
                                      className: "text-xs font-bold px-2.5 py-1 rounded-full",
                                      style: {
                                        color: CATEGORY_COLORS[item.category] || "#94A3B8",
                                        background: `${CATEGORY_COLORS[item.category] || "#94A3B8"}18`,
                                        border: `1px solid ${CATEGORY_COLORS[item.category] || "#94A3B8"}44`
                                      }
                                    },
                                    item.category
                                  ),
                                  h(
                                    "span",
                                    {
                                      className:
                                        "text-xs font-bold px-2.5 py-1 rounded-full bg-white/5 border border-white/10"
                                    },
                                    item.priority === "Tinggi"
                                      ? "● Prioritas Tinggi"
                                      : item.priority === "Sedang"
                                      ? "● Prioritas Sedang"
                                      : "● Prioritas Rendah"
                                  ),
                                  h("span", { className: "text-sm font-semibold flex items-center gap-1.5" }, [
                                    h(Clock, { size: 14, className: "text-[var(--cyan)]" }),
                                    item.start,
                                    " — ",
                                    item.end
                                  ]),
                                  h("span", { className: "text-sm text-[var(--muted)]" }, [
                                    "· ",
                                    formatLongDate(item.date)
                                  ])
                                ]),
                                confirmDeleteId === item.id &&
                                  h(
                                    "div",
                                    {
                                      className:
                                        "mt-3 rounded-xl bg-[#FB7185]/10 border border-[#FB7185]/25 p-3 flex flex-wrap items-center gap-2"
                                    },
                                    [
                                      h(
                                        "span",
                                        { className: "text-sm font-bold flex-1 min-w-[150px]" },
                                        "Hapus jadwal ini?"
                                      ),
                                      h(
                                        "button",
                                        {
                                          type: "button",
                                          onClick: () => deleteOne(item.id),
                                          className:
                                            "px-3 py-1.5 rounded-lg bg-[#FB7185] text-black text-sm font-bold cursor-pointer"
                                        },
                                        "Ya, Hapus"
                                      ),
                                      h(
                                        "button",
                                        {
                                          type: "button",
                                          onClick: () => setConfirmDeleteId(null),
                                          className:
                                            "px-3 py-1.5 rounded-lg border border-white/15 text-sm font-bold cursor-pointer"
                                        },
                                        "Batal"
                                      )
                                    ]
                                  )
                              ]),
                              h("div", { className: "flex sm:flex-col gap-2 shrink-0" }, [
                                h(
                                  "button",
                                  {
                                    type: "button",
                                    onClick: () => startEdit(item),
                                    className: "icon-btn",
                                    "aria-label": `Ubah ${item.title}`
                                  },
                                  h(Pencil, { size: 16 })
                                ),
                                h(
                                  "button",
                                  {
                                    type: "button",
                                    onClick: () =>
                                      setConfirmDeleteId(confirmDeleteId === item.id ? null : item.id),
                                    className: "icon-btn hover:!text-[#FB7185] hover:!border-[#FB7185]/50",
                                    "aria-label": `Hapus ${item.title}`
                                  },
                                  h(Trash2, { size: 16 })
                                )
                              ])
                            ]
                          );
                        })
                      )
                ]),

                // CALLOUT BAWAH
                h(
                  "section",
                  {
                    className:
                      "glass p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center gap-3 justify-between"
                  },
                  [
                    h("div", null, [
                      h("h3", { className: "font-bold flex items-center gap-2" }, [
                        "Fokus hari ini, tanpa beban ",
                        h(Zap, { size: 16, className: "text-[var(--cyan)]" })
                      ]),
                      h(
                        "p",
                        { className: "text-sm text-[var(--muted)] mt-1" },
                        "Satu langkah kecil yang selesai lebih berarti daripada daftar panjang yang tertunda."
                      )
                    ]),
                    h(
                      "button",
                      {
                        type: "button",
                        onClick: () => {
                          resetForm();
                          document.getElementById("form-jadwal")?.scrollIntoView({ behavior: "smooth" });
                        },
                        className:
                          "shrink-0 rounded-xl px-4 py-2.5 font-bold text-[#04060F] bg-white hover:opacity-90 cursor-pointer"
                      },
                      "Tambah Jadwal Baru"
                    )
                  ]
                )
              ])
            ]),

            // FOOTER
            h(
              "footer",
              { className: "text-center text-xs text-[var(--muted-2)] pt-8" },
              "NOVA Schedule · Jadwalmu tersimpan dan tersinkronisasi per akun di Firebase Cloud."
            )
          ]),

          // TOAST NOTIFICATION
          toast &&
            h(
              "div",
              {
                className:
                  "fixed bottom-5 left-1/2 -translate-x-1/2 z-50 max-w-[calc(100vw-32px)] bg-white text-black font-bold text-sm px-4 py-3 rounded-full shadow-2xl flex items-center gap-2"
              },
              [
                h(CheckCircle2, { size: 18, className: "text-emerald-600 shrink-0" }),
                h("span", { className: "[overflow-wrap:anywhere]" }, toast),
                h(
                  "button",
                  {
                    type: "button",
                    onClick: () => setToast(""),
                    "aria-label": "Tutup pemberitahuan",
                    className: "ml-1 cursor-pointer"
                  },
                  h(X, { size: 16 })
                )
              ]
            )
        ]
      );
    }

    createRoot(document.getElementById("root")).render(
      h(React.StrictMode, null, h(NovaScheduleApp))
    );
  </script>
</body>
</html>
